# Secret scanning, identical in every repository of the estate.
#
# This is the free-plan substitute for GitHub Advanced Security push
# protection, which does not cover private repositories. A pull request scans
# only its own commits, so the check is fast and cheap; the full history is
# swept weekly, so nothing hides behind a force-push or a rewrite.
#
# Deliberately runs the pinned gitleaks binary rather than gitleaks-action,
# which requires a paid licence key for organization accounts. The download is
# verified against a pinned checksum, because an unverified curl into a CI
# runner is the same defect this job exists to catch.

name: secrets

on:
  pull_request:
  # Both names are listed because corco-web still defaults to master while
  # every other repository uses main. Renaming it is pending: Cloudflare
  # Pages pins its production branch by name. Until then this file stays
  # identical everywhere and works either way.
  push:
    branches: [main, master]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Decide what to scan
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # An empty log_opts means "scan the entire history".
          log_opts=""
          case "$EVENT" in
            pull_request)
              log_opts="--no-merges $PR_BASE..$PR_HEAD"
              ;;
            push)
              # A branch's first push, or a force-push whose old tip is gone,
              # has no usable range: fall back to the full history.
              if [ -n "$PUSH_BEFORE" ] \
                && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
                && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                log_opts="--no-merges $PUSH_BEFORE..$PUSH_AFTER"
              fi
              ;;
          esac
          echo "log_opts=$log_opts" >> "$GITHUB_OUTPUT"
          echo "Scanning: ${log_opts:-full history}"

      - name: Scan
        run: |
          ./gitleaks git . \
            --platform github \
            --redact \
            --no-banner \
            --exit-code 1 \
            --log-opts "${{ steps.scope.outputs.log_opts }}"
